name: Kasa tests
# Development policy: independently run tests first to avoid automatic hosted CI costs.
# Hosted workflows are preserved for manual release verification.
# Restore push/pull_request triggers only after budget and runner settings are reviewed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          kasa run examples/hello.kasa
          kasa check examples/hello.kasa
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native browser interpreter (no Pyodide)
        run: |
          node --check playground/kasa-runtime.js
          node --check playground/worker.js
          node --check playground/app.js
          node --test tests/test_kasa_browser.cjs
