# Netlify: import this GitHub repo as a site; base directory = repository root.
# Publish output is built from the actual native Emscripten engine on every deploy.
[build]
  command = "bash scripts/netlify_build.sh"
  publish = "dist/netlify"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "22"

[[headers]]
  for = "/native/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Embedding is permitted for the academy, which is a different origin.
    # After the final academy domain is known, restrict this directive to it.
    Content-Security-Policy = "frame-ancestors https:"
