[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasa-language"
version = "0.1.0"
description = "A Twi-first educational programming language and interpreter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary — license pending"}
authors = [{name = "Kasa contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kasa = "kasa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
